spring.application.name=jobtracker

spring.datasource.url=jdbc:postgresql://localhost:5432/jobtracker
spring.datasource.username=postgres
spring.datasource.password=Deadpool@08
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT - this secret is fine for local development only.
# Never commit a real production secret to source control -
# in production this should come from an environment variable.
jwt.secret=ThisIsASecretKeyForJWTSigningPleaseChangeInProduction123!
jwt.expiration=86400000

# Resume uploads - PDFs of resumes are small, 5MB is generous
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# AI resume/JD matching - Google Gemini (free tier, no credit card needed).
# Get a key at https://aistudio.google.com/apikey - never hardcode it here.
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=gemini-3.6-flash