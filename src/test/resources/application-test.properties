# Used only when @ActiveProfiles("test") is active - keeps integration
# tests off your real Postgres database entirely.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

jwt.secret=TestSecretKeyForJWTSigningInTestsOnly1234567890
jwt.expiration=86400000

gemini.api.key=test-key-not-actually-called-in-these-tests
gemini.api.model=gemini-3.6-flash

cors.allowed-origins=http://localhost:5173
